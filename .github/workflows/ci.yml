name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pack validation
        run: python scripts/workflow.py check
      - name: Runtime tests
        if: success() || failure()
        run: python scripts/test_session.py
      - name: Installer tests
        if: success() || failure()
        run: python scripts/test_workflow.py
      - name: Golden path integration tests (stub worker)
        if: success() || failure()
        run: python scripts/test_relay.py
